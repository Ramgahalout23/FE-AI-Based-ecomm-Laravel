services:
  # Option 1: Static Site (recommended for SPAs)
  - type: static_site
    name: fe-ai-based-ecomm-laravel
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

